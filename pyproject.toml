[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chunk-kit"
version = "0.2.0"
description = "Inspectable document ingestion, hybrid retrieval and evaluation for RAG experiments."
requires-python = ">=3.10"
authors = [{name = "Aarnav Saboo"}]
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]

[project.scripts]
rag-kit = "rag_chunk_kit.cli:main"
rag-chunk = "rag_chunk_kit.cli:legacy_main"

[tool.setuptools.packages.find]
include = ["rag_chunk_kit*"]

[project.urls]
Repository = "https://github.com/aarnavsaboo/rag-chunk-kit"
