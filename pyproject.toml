[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chunk-kit"
version = "0.3.0"
description = "Local document ingestion, hybrid retrieval and RAG experiment tooling."
requires-python = ">=3.10"
authors = [{name = "Aarnav Saboo"}]
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]

[project.scripts]
rag-kit = "rag_chunk_kit.cli:main"
rag-chunk = "rag_chunk_kit.cli:legacy_main"
rag-experiment = "rag_chunk_kit.experiment_cli:main"

[tool.setuptools.packages.find]
include = ["rag_chunk_kit*"]
